<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Login — BRIO</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header></header>
    <main class="container">
        <form class="form" onsubmit="entrar(event)">
            <h1>Entrar</h1>
            <p class="muted">Continue sua jornada de estudos.</p>
            <div id="msg" class="msg"></div>
            <div class="field"><label>E-mail</label><input id="email" type="email" required></div>
            <div class="field"><label>Senha</label><input id="senha" type="password" required></div>
            <button class="btn">Entrar</button>
            <p>Não possui conta? <a href="cadastro.html"><b>Cadastre-se</b></a></p>
        </form>
    </main>
    <script src="js/app.js"></script>
    <script>
        async function entrar(e) { e.preventDefault(); try { const d = await api('login', { method: 'POST', body: JSON.stringify({ email: email.value, senha: senha.value }) }); location.href = d.usuario.tipo === 'professor' ? 'professor.html' : 'dashboard.html' } catch (err) { setMsg('msg', err.message) } }
    </script>
</body>

</html>
