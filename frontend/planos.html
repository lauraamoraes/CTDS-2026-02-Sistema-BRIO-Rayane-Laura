<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Planos | BRIO</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            margin: 0;
            background: #fffaf7;
            color: #4c3b48;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* Cabeçalho */
        .topo-planos {
            padding: 22px 32px;
            background: #efe7f7;
            border-bottom: 1px solid #e2d9e8;
        }

        .topo-planos h1 {
            margin: 0 0 8px;
            color: #5b3f88;
            font-size: 30px;
        }

        .topo-planos p {
            margin: 0;
            color: #796d80;
            font-size: 18px;
        }

        /* Área dos planos */
        .area-planos {
            max-width: 1500px;
            margin: 0 auto;
            padding: 80px 32px 35px;
        }

        .grade-planos {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 24px;
            align-items: stretch;
        }

        /* Cartões */
        .card-plano {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: space-between;
            min-width: 0;
            padding: 30px 22px;
            text-align: center;
            background: #fff;
            border: 1px solid #e2d9e8;
            border-radius: 25px;
            box-shadow: 0 12px 35px rgba(70, 45, 85, .09);
        }

        /* Plano em destaque */
        .card-plano.destaque {
            background: #efe7f7;
            border: 3px solid #5b3f88;
            padding: 33px 30px;
        }

        .card-plano h2 {
            margin: 0 0 20px;
            color: #5b3f88;
            font-size: 27px;
        }

        /* Preços */
        .preco {
            margin-bottom: 25px;
            color: #5b3f88;
            font-size: 42px;
            font-weight: 700;
            white-space: nowrap;
        }

        .preco small {
            font-size: 16px;
            font-weight: 400;
        }

        .descricao-plano {
            min-height: 65px;
            margin: 0 0 25px;
            color: #4c3b48;
            font-size: 16px;
            line-height: 1.6;
        }

        .duracao {
            margin: 15px 0 35px;
            font-size: 19px;
        }

        /* Botões */
        .btn-escolher {
            width: 100%;
            padding: 15px 12px;
            border: none;
            border-radius: 14px;
            background: #5b3f88;
            color: white;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: background .2s, transform .2s;
        }

        .btn-escolher:hover {
            background: #4c3374;
            transform: translateY(-2px);
        }

        .btn-escolher:disabled {
            opacity: .6;
            cursor: wait;
            transform: none;
        }

        /* Plano gratuito */
        .card-plano.gratuito {
            border: 2px solid #b9a9cf;
        }

        .card-plano.gratuito .preco {
            color: #39845b;
        }

        /* Aviso */
        .aviso {
            margin-top: 38px;
            color: #796d80;
            font-size: 17px;
            text-align: center;
        }

        #mensagemPlanos {
            margin: 20px 0;
            color: #b33;
            text-align: center;
        }

        /* Responsividade */
        @media (max-width: 1100px) {
            .grade-planos {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 600px) {
            .area-planos {
                padding: 35px 20px;
            }

            .grade-planos {
                grid-template-columns: 1fr;
                gap: 18px;
            }

            .card-plano {
                padding: 28px 22px;
            }

            .card-plano.destaque {
                padding: 26px 20px;
            }

            .preco {
                font-size: 40px;
                margin-bottom: 24px;
            }

            .topo-planos {
                padding: 20px;
            }

            .topo-planos h1 {
                font-size: 23px;
            }

            .topo-planos p {
                font-size: 15px;
            }
        }
    </style>
<link rel="icon" type="image/png" href="img/logo.png">
<link rel="shortcut icon" type="image/png" href="img/logo.png">
</head>

<body>

    <header></header>

    <section class="topo-planos">

        <h1>
            Confira nossos planos e escolha o mais ideal para você!
        </h1>

        <p>
            Você já está se tornando aluno da melhor plataforma de estudos...
        </p>

    </section>

    <main class="area-planos">

        <div id="mensagemPlanos"></div>

        <div id="lista" class="grade-planos">

            <p>Carregando planos...</p>

        </div>

    </main>

    <script src="js/app.js?v=20261103"></script>

    <script>
        initPlanos().catch(function (erro) {

            console.error(erro);

            const mensagem = document.getElementById('mensagemPlanos');

            if (mensagem) {
                mensagem.textContent =
                    'Não foi possível carregar os planos. Tente novamente.';
            }

        });
    </script>

</body>
</html>
