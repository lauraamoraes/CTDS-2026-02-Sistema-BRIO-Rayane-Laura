<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bem-vindo ao BRIO</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
       
/* ==========================================
   BRIO - PÁGINA DE BOAS-VINDAS
========================================== */

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    background: linear-gradient(
        135deg,
        #fffaf8 0%,
        #f6edff 55%,
        #fffaf8 100%
    );

    font-family: 'Poppins', sans-serif;
    color: #493550;

    padding: 24px;
    box-sizing: border-box;
}

/* Cartão central */

.boas-vindas-card {
    width: 100%;
    max-width: 650px;

    background: #ffffff;
    border: 1px solid #e7d8f3;
    border-radius: 30px;

    padding: 45px 50px;
    box-sizing: border-box;

    text-align: center;

    box-shadow:
        0 18px 50px rgba(96, 61, 145, 0.10);

    animation: aparecer 0.6s ease;
}

/* Mascote */

.mascote-boas-vindas {
    display: block;
    width: 145px;
    height: 145px;

    object-fit: contain;

    margin: 0 auto 20px;

    filter: drop-shadow(
        0 10px 12px rgba(96, 61, 145, 0.12)
    );
}

/* Etiqueta */

.boas-vindas-etiqueta {
    display: inline-block;

    background: #f3eafe;
    color: #8655ad;

    border-radius: 50px;
    padding: 9px 18px;

    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;

    margin-bottom: 18px;
}

/* Título */

.boas-vindas-card h1 {
    color: #603d91;

    font-size: clamp(28px, 4vw, 42px);
    font-weight: 800;
    line-height: 1.3;

    margin: 0 0 20px;
}

/* Descrição */

.boas-vindas-card p {
    color: #806b8d;

    font-size: 17px;
    line-height: 1.8;

    margin: 0 auto 30px;
    max-width: 540px;
}

/* Botão */

.btn-boas-vindas {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    min-height: 55px;
    padding: 15px 30px;

    background: #603d91;
    color: #ffffff;

    border: none;
    border-radius: 16px;

    font-family: 'Poppins', sans-serif;
    font-size: 16px;
    font-weight: 700;
    text-decoration: none;

    cursor: pointer;

    transition:
        background 0.2s ease,
        transform 0.2s ease,
        box-shadow 0.2s ease;
}

.btn-boas-vindas:hover {
    background: #4e317e;
    color: #ffffff;

    transform: translateY(-3px);

    box-shadow:
        0 10px 25px rgba(96, 61, 145, 0.20);
}

/* Animação */

@keyframes aparecer {
    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Celular */

@media (max-width: 600px) {

    .boas-vindas-card {
        padding: 32px 24px;
        border-radius: 24px;
    }

    .mascote-boas-vindas {
        width: 115px;
        height: 115px;
    }

    .boas-vindas-card p {
        font-size: 15px;
    }

    .btn-boas-vindas {
        width: 100%;
        box-sizing: border-box;
    }
}

@media (prefers-reduced-motion: reduce) {
    .boas-vindas-card {
        animation: none;
    }

    .btn-boas-vindas {
        transition: none;
    }
}

        
/* Mascote da página de boas-vindas */

.mascote-boas-vindas {
    display: block;
    width: 110px;
    height: 110px;
    object-fit: contain;
    margin: 0 auto 25px;
}

@media (max-width: 600px) {
    .mascote-boas-vindas {
        width: 90px;
        height: 90px;
        margin-bottom: 20px;
    }
}

    </style>
    <link rel="icon" type="image/png" href="img/logo.png">
<link rel="shortcut icon" type="image/png" href="img/logo.png"> 
</head>

<body>

    
<main class="boas-vindas-card">

    <img
        src="img/12.png"
        alt="Mascote BRIO estudando"
        class="mascote-boas-vindas"
    >

    <span class="boas-vindas-etiqueta">
        ✨ SUA JORNADA COMEÇA AQUI
    </span>

    <h1>Bem-vindo ao BRIO! 💜</h1>

    <p>
        Seu acesso gratuito foi ativado com sucesso!
        Aproveite os conteúdos, simulados e redações
        para começar sua jornada de estudos.
    </p>

    <a href="dashboard.html" class="btn-boas-vindas">
        Ir para a página inicial
    </a>

</main>


</body>
</html>
