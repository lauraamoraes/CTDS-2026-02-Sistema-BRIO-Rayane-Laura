<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>Entrar como professor — BRIO</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="img/logo.png">
<link rel="shortcut icon" type="image/png" href="img/logo.png">
</head>

<body>

    <header></header>

    <main class="container">

        <form class="form" onsubmit="entrarProfessor(event)">

            <span class="badge">
                ÁREA DO PROFESSOR
            </span>

            <h1>
                Entrar como professor
            </h1>

            <p class="muted">
                Acesse sua área para acompanhar e corrigir as redações.
            </p>

            <div id="msg" class="msg"></div>

            <div class="field">
                <label for="email">
                    E-mail
                </label>

                <input
                    id="email"
                    type="email"
                    placeholder="Digite seu e-mail"
                    required
                >
            </div>

            <div class="field">
                <label for="senha">
                    Senha
                </label>

                <input
                    id="senha"
                    type="password"
                    placeholder="Digite sua senha"
                    required
                >
            </div>

            <button class="btn" type="submit">
                Entrar
            </button>

            <p class="small">
                Não tem uma conta?
                <a href="professor-cadastro.html">
                    <b>Cadastre-se</b>
                </a>
            </p>

        </form>

    </main>

<script src="js/app.js?v=20261109c"></script>
    <script>
        async function entrarProfessor(event) {

            event.preventDefault();

            const email =
                document.getElementById('email').value;

            const senha =
                document.getElementById('senha').value;

            setMsg('msg', '', false);

            try {

                const dados = await api('login', {
                    method: 'POST',

                    body: JSON.stringify({
                        email: email,
                        senha: senha
                    })
                });

                if (dados.usuario.tipo !== 'professor') {

                    await api('logout', {
                        method: 'POST'
                    });

                    throw new Error(
                        'Este acesso é exclusivo para professores.'
                    );
                }

                window.location.href =
                    'professor.html';

            } catch (erro) {

                setMsg(
                    'msg',
                    erro.message || 'Não foi possível entrar.'
                );
            }
        }
    </script>

</body>

</html>
